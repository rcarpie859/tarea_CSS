<div id="box-container">
    <div id="box-1"></div>
    <div id="box-2"></div>
  </div>
  
  <style>
    #box-container {
      display: flex; /* Se activa Flexbox */
      height: 500px;
    }
  
    #box-1 {
      background-color: dodgerblue;
      width: 100%; /* Cambiado a 100% */
      height: 50%;
      flex-shrink: 1; /* Se permite que #box-1 se encoja */
    }
  
    #box-2 {
      background-color: orangered;
      width: 100%; /* Cambiado a 100% */
      height: 50%;
      flex-shrink: 2; /* Se permite que #box-2 se encoja más que #box-1 */
    }
  </style>
